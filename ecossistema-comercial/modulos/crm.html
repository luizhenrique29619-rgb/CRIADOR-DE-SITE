<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clientes & Leads · Comercial Record</title>
  <link rel="stylesheet" href="../css/sistema.css" />
</head>
<body>
  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="overlay" id="overlay"></div>

    <div class="principal">
      <header class="topo" id="topo"></header>

      <main class="conteudo" id="conteudo">

        <!-- KPIs rápidos -->
        <div class="grade grade--kpi" id="kpis"></div>

        <!-- Ferramentas -->
        <div class="ferramentas mt-20">
          <div class="busca"><input type="text" id="busca" placeholder="Buscar por nome, segmento ou contato..." /></div>
          <select id="filtroStatus" class="campo" style="margin:0;width:auto;">
            <option value="">Todos os status</option>
            <option>Ativo</option><option>Negociação</option><option>Lead</option><option>Inativo</option>
          </select>
          <button class="btn btn--primario" id="btnNovo" style="margin-left:auto;">+ Novo cliente</button>
        </div>

        <!-- Formulário (escondido por padrão) -->
        <div class="cartao oculto" id="formCard" style="margin-bottom:18px;">
          <div class="cartao__cabeca"><h3>Novo cliente / lead</h3></div>
          <div class="cartao__corpo">
            <form id="formCliente">
              <div class="form-linha">
                <div class="campo"><label>Nome da empresa *</label><input name="nome" required /></div>
                <div class="campo"><label>Segmento</label><input name="segmento" placeholder="Varejo, Saúde..." /></div>
              </div>
              <div class="form-linha">
                <div class="campo"><label>Contato</label><input name="contato" /></div>
                <div class="campo"><label>Telefone</label><input name="telefone" /></div>
              </div>
              <div class="form-linha">
                <div class="campo"><label>Responsável (vendedor)</label><input name="responsavel" /></div>
                <div class="campo"><label>Status</label>
                  <select name="status"><option>Lead</option><option>Negociação</option><option>Ativo</option><option>Inativo</option></select>
                </div>
              </div>
              <div class="flex-entre">
                <span class="texto-2" id="formMsg" style="font-size:.85rem;"></span>
                <span style="display:flex;gap:10px;">
                  <button type="button" class="btn btn--neutro" id="btnCancelar">Cancelar</button>
                  <button type="submit" class="btn btn--primario">Salvar</button>
                </span>
              </div>
            </form>
          </div>
        </div>

        <!-- Tabela -->
        <div class="cartao">
          <div class="tabela-wrap">
            <table class="tabela">
              <thead><tr>
                <th>Cliente</th><th>Segmento</th><th>Contato</th><th>Responsável</th><th>Status</th><th class="num">Valor/mês</th>
              </tr></thead>
              <tbody id="tabela"></tbody>
            </table>
          </div>
        </div>

      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/cvcrm.js"></script>
  <script src="../js/dados-exemplo.js"></script>
  <script src="../js/sistema.js"></script>
  <script>
    montarLayout({ ativo: 'crm', titulo: 'Clientes & Leads', sub: 'Gestão de contas e prospecção' });

    const badgeStatus = { 'Ativo':'ok', 'Negociação':'atencao', 'Lead':'azul', 'Inativo':'neutro' };
    let TODOS = [];

    async function iniciar() {
      const { dados, fonte } = await carregarDados('clientes', DADOS.clientes, 'clientes');
      TODOS = dados;
      avisoFonte(fonte, 'conteudo');
      montarKPIs();
      render();
    }

    function montarKPIs() {
      const ativos = TODOS.filter(c=>c.status==='Ativo').length;
      const leads = TODOS.filter(c=>c.status==='Lead').length;
      const negoc = TODOS.filter(c=>c.status==='Negociação').length;
      const receita = TODOS.reduce((s,c)=>s+Number(c.valor_mes||0),0);
      document.getElementById('kpis').innerHTML = [
        { i:'👥', r:'Total de contas', v: TODOS.length },
        { i:'✅', r:'Clientes ativos', v: ativos },
        { i:'🌱', r:'Leads + negociação', v: leads+negoc },
        { i:'💰', r:'Receita recorrente', v: moedaCurta(receita) },
      ].map(k=>`<div class="kpi"><div class="kpi__rotulo"><span class="kpi__icone">${k.i}</span> ${k.r}</div><div class="kpi__valor">${k.v}</div></div>`).join('');
    }

    function render() {
      const termo = document.getElementById('busca').value.toLowerCase();
      const status = document.getElementById('filtroStatus').value;
      const filtrados = TODOS.filter(c => {
        const texto = `${c.nome} ${c.segmento||''} ${c.contato||''}`.toLowerCase();
        return texto.includes(termo) && (!status || c.status===status);
      });
      const tb = document.getElementById('tabela');
      if (!filtrados.length) { tb.innerHTML = `<tr><td colspan="6" class="texto-2" style="text-align:center;padding:30px;">Nenhum cliente encontrado.</td></tr>`; return; }
      tb.innerHTML = filtrados.map(c=>`
        <tr>
          <td><span class="celula-nome"><span class="avatar-mini">${iniciais(c.nome)}</span>
            <span><strong>${esc(c.nome)}</strong></span></span></td>
          <td>${esc(c.segmento||'—')}</td>
          <td>${esc(c.contato||'—')}<br><small class="texto-2">${esc(c.telefone||'')}</small></td>
          <td>${esc(c.responsavel||'—')}</td>
          <td><span class="badge badge--${badgeStatus[c.status]||'neutro'}">${esc(c.status||'—')}</span></td>
          <td class="num forte">${Number(c.valor_mes)>0 ? moeda(c.valor_mes) : '—'}</td>
        </tr>`).join('');
    }

    document.getElementById('busca').addEventListener('input', render);
    document.getElementById('filtroStatus').addEventListener('change', render);

    // Form
    const formCard = document.getElementById('formCard');
    document.getElementById('btnNovo').addEventListener('click', ()=> formCard.classList.toggle('oculto'));
    document.getElementById('btnCancelar').addEventListener('click', ()=> formCard.classList.add('oculto'));

    document.getElementById('formCliente').addEventListener('submit', async (e)=>{
      e.preventDefault();
      const f = e.target;
      const novo = {
        nome: f.nome.value.trim(), segmento: f.segmento.value.trim(),
        contato: f.contato.value.trim(), telefone: f.telefone.value.trim(),
        responsavel: f.responsavel.value.trim(), status: f.status.value, valor_mes: 0
      };
      const msg = document.getElementById('formMsg');

      if (window.supabaseClient) {
        const { error } = await window.supabaseClient.from('clientes').insert([novo]);
        if (error) { msg.textContent = 'Erro ao salvar: ' + error.message; msg.style.color='var(--critico)'; return; }
        msg.textContent = 'Cliente salvo no banco! ✅'; msg.style.color='var(--ok)';
        await iniciar();
      } else {
        novo.id = Date.now();
        TODOS.unshift(novo);
        montarKPIs(); render();
        msg.textContent = 'Adicionado (exemplo local — ligue o Supabase para salvar de verdade).'; msg.style.color='var(--atencao)';
      }
      f.reset();
      setTimeout(()=>{ formCard.classList.add('oculto'); msg.textContent=''; }, 1400);
    });

    iniciar();
  </script>
</body>
</html>
